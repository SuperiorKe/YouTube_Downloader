<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f0f" />
  <title>TubeVault</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>▶ TubeVault</h1>
    <div class="meta">
      <span id="net-dot" class="dot online" title="online"></span>
      <span id="storage-info"></span>
    </div>
  </header>

  <!-- Passcode gate (shown only when the API answers 401) -->
  <div id="gate" class="overlay hidden">
    <div class="card">
      <h2>Enter access key</h2>
      <input id="gate-key" type="password" placeholder="Access key" autocomplete="current-password" />
      <button id="gate-submit" class="primary">Unlock</button>
      <p id="gate-error" class="error hidden">Wrong key, try again.</p>
    </div>
  </div>

  <main>
    <!-- Add -->
    <section class="card" id="add-card">
      <form id="add-form">
        <input id="url-input" type="url" inputmode="url" placeholder="Paste a YouTube link…" required />
        <button type="submit" class="primary" id="fetch-btn">Fetch</button>
      </form>
      <p id="add-status" class="status hidden"></p>

      <!-- Preview -->
      <div id="preview" class="preview hidden">
        <img id="pv-thumb" alt="" />
        <div class="pv-body">
          <p id="pv-title" class="pv-title"></p>
          <p id="pv-sub" class="pv-sub"></p>
          <div class="pv-actions">
            <button id="save-video" class="primary"></button>
            <button id="save-audio"></button>
          </div>
          <div id="dl-progress" class="progress hidden"><div id="dl-bar"></div></div>
          <p id="dl-status" class="status hidden"></p>
        </div>
      </div>
    </section>

    <!-- Player -->
    <section id="player-card" class="card hidden">
      <video id="player" controls playsinline></video>
      <p id="player-title" class="pv-title"></p>
    </section>

    <!-- Library -->
    <section class="card">
      <h2>Library <span id="lib-count" class="badge"></span></h2>
      <ul id="library" class="library"></ul>
      <p id="lib-empty" class="status">Nothing saved yet. Paste a link above — everything you save plays offline.</p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
